name: NovaRun Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  # Isolate commits so a wedged emulator job from an older commit cannot block
  # verification of the current source revision.
  group: novarun-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python runtime bridge
        run: python -m unittest discover -s app/src/test/python -p 'test_*.py'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download pinned Node.js Mobile runtime
        run: |
          mkdir -p app/src/main/jniLibs
          NODE_MOBILE_VERSION="24.22.1-0"
          NODE_MOBILE_SHA256="d6fd9f610fe5d81fede8f0d400c5a62723247725a19831835f15abf4f0604250"
          curl -fL --retry 3 "https://github.com/fogtape/nodejs-mobile/releases/download/v${NODE_MOBILE_VERSION}/nodejs-mobile-android-${NODE_MOBILE_VERSION}.zip" -o /tmp/node-mobile.zip
          echo "${NODE_MOBILE_SHA256}  /tmp/node-mobile.zip" | sha256sum --check -
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          for abi in arm64-v8a x86_64; do
            library="$(find /tmp/node-mobile -type f -path "*/$abi/libnode.so" -print -quit)"
            test -n "$library"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$library" "app/src/main/jniLibs/$abi/libnode.so"
          done
          header="$(find /tmp/node-mobile -type f -path "*/include/node/node.h" -print -quit)"
          test -n "$header"
          mkdir -p app/src/main/cpp/node-include
          cp -R "$(dirname "$header")/." app/src/main/cpp/node-include/
          test -f app/src/main/cpp/node-include/node.h

      - name: Verify Gradle
        run: gradle --version

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaRun-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  runtime-verification:
    name: Verify Node.js 24 and SQLite on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python runtime bridge
        run: python -m unittest discover -s app/src/test/python -p 'test_*.py'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download pinned Node.js Mobile runtime
        run: |
          mkdir -p app/src/main/jniLibs
          NODE_MOBILE_VERSION="24.22.1-0"
          NODE_MOBILE_SHA256="d6fd9f610fe5d81fede8f0d400c5a62723247725a19831835f15abf4f0604250"
          curl -fL --retry 3 "https://github.com/fogtape/nodejs-mobile/releases/download/v${NODE_MOBILE_VERSION}/nodejs-mobile-android-${NODE_MOBILE_VERSION}.zip" -o /tmp/node-mobile.zip
          echo "${NODE_MOBILE_SHA256}  /tmp/node-mobile.zip" | sha256sum --check -
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          for abi in arm64-v8a x86_64; do
            library="$(find /tmp/node-mobile -type f -path "*/$abi/libnode.so" -print -quit)"
            test -n "$library"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$library" "app/src/main/jniLibs/$abi/libnode.so"
          done
          header="$(find /tmp/node-mobile -type f -path "*/include/node/node.h" -print -quit)"
          test -n "$header"
          mkdir -p app/src/main/cpp/node-include
          cp -R "$(dirname "$header")/." app/src/main/cpp/node-include/
          test -f app/src/main/cpp/node-include/node.h

      - name: Download target clothing-store ZIP fixtures
        run: |
          mkdir -p app/src/androidTest/assets
          TEST_FILE_COMMIT="5211030586fe6cf12dc3e1c74b40b9c4a49f66f6"
          curl -fL --retry 3 "https://raw.githubusercontent.com/ishak6/Test-file/${TEST_FILE_COMMIT}/clothing_store_secure_fullstack.zip" -o app/src/androidTest/assets/clothing_store_secure_fullstack.zip
          curl -fL --retry 3 "https://raw.githubusercontent.com/ishak6/Test-file/${TEST_FILE_COMMIT}/clothing_store_nokshi_v1.5.3_professional.zip" -o app/src/androidTest/assets/clothing_store_nokshi_v1.5.3_professional.zip
          unzip -t app/src/androidTest/assets/clothing_store_secure_fullstack.zip
          unzip -t app/src/androidTest/assets/clothing_store_nokshi_v1.5.3_professional.zip

      - name: Verify Gradle
        run: gradle --version

      # Compile before the emulator starts. The app bundles Python and Node.js
      # native runtimes, so building while the AVD is running wastes RAM/CPU
      # and makes the emulator install phase less reliable.
      - name: Build Node.js instrumentation APKs
        run: |
          gradle -Pnovarun.testAbi=x86_64 assembleDebug assembleDebugAndroidTest --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify Node.js 24 and SQLite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout-minutes: 30
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 4096 -cores 4
          disable-animations: true
          script: |
            # The emulator runner executes this script with /bin/sh, not Bash.
            # Keep the script POSIX-compatible; do not use pipefail or PIPESTATUS.
            set -eu
            mkdir -p app/build/reports/novarun-runtime
            APK="app/build/outputs/apk/debug/app-debug.apk"
            TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

            # APKs were compiled before the emulator booted.
            test -s "$APK"
            test -s "$TEST_APK"

            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global package_verifier_enable 0 || true

            echo "Installing app APK with non-streaming ADB to avoid ddmlib split-installer timeout..."
            timeout 20m adb install --no-streaming -r "$APK"
            echo "Installing instrumentation APK..."
            timeout 10m adb install --no-streaming -r "$TEST_APK"

            TEST_PACKAGE="com.mangalocalrunnerplus.test"
            test -n "$TEST_PACKAGE"
            echo "Instrumentation package: $TEST_PACKAGE"

            set +e
            adb shell am instrument -w -r "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" > app/build/reports/novarun-runtime/instrumentation.txt 2>&1
            TEST_EXIT=$?
            cat app/build/reports/novarun-runtime/instrumentation.txt
            set -e
            adb logcat -d -t 5000 > app/build/reports/novarun-runtime/logcat.txt || true

            if [ "$TEST_EXIT" -ne 0 ] || ! grep -Eq 'OK.*[0-9]+ tests?' app/build/reports/novarun-runtime/instrumentation.txt || grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=' app/build/reports/novarun-runtime/instrumentation.txt; then
              echo "Android instrumentation tests did not pass."
              exit 1
            fi
            echo "All NovaRun ZIP runtime instrumentation tests passed."

      - name: Upload Android runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaRun-Android-Runtime-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/novarun-runtime/
          if-no-files-found: ignore
          retention-days: 7
