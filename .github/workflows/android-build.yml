name: NovaRun Android APK Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  # Isolate commits so a wedged emulator job from an older commit cannot block
  # verification of the current source revision.
  group: novarun-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python runtime bridge
        run: python -m unittest discover -s app/src/test/python -p 'test_*.py'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download pinned Node.js Mobile runtime
        run: |
          mkdir -p app/src/main/jniLibs
          NODE_MOBILE_VERSION="24.22.1-0"
          NODE_MOBILE_SHA256="d6fd9f610fe5d81fede8f0d400c5a62723247725a19831835f15abf4f0604250"
          curl -fL --retry 3 "https://github.com/fogtape/nodejs-mobile/releases/download/v${NODE_MOBILE_VERSION}/nodejs-mobile-android-${NODE_MOBILE_VERSION}.zip" -o /tmp/node-mobile.zip
          echo "${NODE_MOBILE_SHA256}  /tmp/node-mobile.zip" | sha256sum --check -
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          for abi in arm64-v8a x86_64; do
            library="$(find /tmp/node-mobile -type f -path "*/$abi/libnode.so" -print -quit)"
            test -n "$library"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$library" "app/src/main/jniLibs/$abi/libnode.so"
          done
          header="$(find /tmp/node-mobile -type f -path "*/include/node/node.h" -print -quit)"
          test -n "$header"
          mkdir -p app/src/main/cpp/node-include
          cp -R "$(dirname "$header")/." app/src/main/cpp/node-include/
          test -f app/src/main/cpp/node-include/node.h

      - name: Verify Gradle
        run: gradle --version

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # The app supports arm64-v8a and x86_64. A successful Gradle build alone
      # does not prove that both embedded Node libraries were packaged for the
      # matching ELF machine type, so inspect the final APK before publishing it.
      - name: Verify packaged Node.js native ABIs
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -s "$APK"
          test -x "$READELF"

          for abi in arm64-v8a x86_64; do
            case "$abi" in
              arm64-v8a) expected_machine="AArch64" ;;
              x86_64) expected_machine="Advanced Micro Devices X86-64" ;;
            esac

            for library in libnode.so libnovarun_node_bridge.so; do
              entry="lib/$abi/$library"
              if ! unzip -Z1 "$APK" | grep -Fxq "$entry"; then
                echo "::error::APK is missing $entry"
                exit 1
              fi

              extracted="/tmp/novarun-$abi-$library"
              unzip -p "$APK" "$entry" > "$extracted"
              machine="$("$READELF" -h "$extracted" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
              if [ "$machine" != "$expected_machine" ]; then
                echo "::error::$entry has ELF machine '$machine'; expected '$expected_machine'"
                exit 1
              fi
              echo "Verified $entry ($machine)"
            done
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaRun-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  runtime-verification:
    name: Verify Node.js 24 and SQLite on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python runtime bridge
        run: python -m unittest discover -s app/src/test/python -p 'test_*.py'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download pinned Node.js Mobile runtime
        run: |
          mkdir -p app/src/main/jniLibs
          NODE_MOBILE_VERSION="24.22.1-0"
          NODE_MOBILE_SHA256="d6fd9f610fe5d81fede8f0d400c5a62723247725a19831835f15abf4f0604250"
          curl -fL --retry 3 "https://github.com/fogtape/nodejs-mobile/releases/download/v${NODE_MOBILE_VERSION}/nodejs-mobile-android-${NODE_MOBILE_VERSION}.zip" -o /tmp/node-mobile.zip
          echo "${NODE_MOBILE_SHA256}  /tmp/node-mobile.zip" | sha256sum --check -
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          for abi in arm64-v8a x86_64; do
            library="$(find /tmp/node-mobile -type f -path "*/$abi/libnode.so" -print -quit)"
            test -n "$library"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$library" "app/src/main/jniLibs/$abi/libnode.so"
          done
          header="$(find /tmp/node-mobile -type f -path "*/include/node/node.h" -print -quit)"
          test -n "$header"
          mkdir -p app/src/main/cpp/node-include
          cp -R "$(dirname "$header")/." app/src/main/cpp/node-include/
          test -f app/src/main/cpp/node-include/node.h

      - name: Download target clothing-store ZIP fixtures
        run: |
          mkdir -p app/src/androidTest/assets
          TEST_FILE_COMMIT="5211030586fe6cf12dc3e1c74b40b9c4a49f66f6"
          curl -fL --retry 3 "https://raw.githubusercontent.com/ishak6/Test-file/${TEST_FILE_COMMIT}/clothing_store_secure_fullstack.zip" -o app/src/androidTest/assets/clothing_store_secure_fullstack.zip
          curl -fL --retry 3 "https://raw.githubusercontent.com/ishak6/Test-file/${TEST_FILE_COMMIT}/clothing_store_nokshi_v1.5.3_professional.zip" -o app/src/androidTest/assets/clothing_store_nokshi_v1.5.3_professional.zip
          unzip -t app/src/androidTest/assets/clothing_store_secure_fullstack.zip
          unzip -t app/src/androidTest/assets/clothing_store_nokshi_v1.5.3_professional.zip

      - name: Verify Gradle
        run: gradle --version

      # Compile before the emulator starts. The app bundles Python and Node.js
      # native runtimes, so building while the AVD is running wastes RAM/CPU
      # and makes the emulator install phase less reliable.
      - name: Build Node.js instrumentation APKs
        run: |
          gradle -Pnovarun.testAbi=x86_64 assembleDebug assembleDebugAndroidTest --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      # GitHub-hosted Linux runners expose /dev/kvm but the runner user
      # may not have permission to open it. Without KVM the emulator falls
      # back to software CPU emulation and can take >15 minutes to boot.
      - name: Enable and verify KVM for Android emulator
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner; choose a Linux runner with nested virtualization."
            exit 1
          fi
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Runner user cannot read/write /dev/kvm after permission setup."
            exit 1
          fi
          echo "KVM device is present and readable/writable."

      - name: Verify Node.js 24 and SQLite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          working-directory: ${{ github.workspace }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 4096 -cores 4
          disable-animations: true
          # android-emulator-runner parses `script` into separate shell invocations.
          # Keep stateful logic in one checked-in script file.
          script: sh scripts/verify-android-runtime.sh

      - name: Upload Android runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaRun-Android-Runtime-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/novarun-runtime/
          if-no-files-found: ignore
          retention-days: 7
