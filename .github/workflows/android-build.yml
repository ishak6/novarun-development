
name: NovaRun Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: novarun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python runtime bridge
        run: python -m unittest discover -s app/src/test/python -p 'test_*.py'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK and native toolchain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download pinned Node.js Mobile runtime
        run: |
          mkdir -p app/src/main/jniLibs
          curl -fL --retry 3 "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip" -o /tmp/node-mobile.zip
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          for abi in arm64-v8a x86_64; do
            library="$(find /tmp/node-mobile -type f -path "*/$abi/libnode.so" -print -quit)"
            test -n "$library"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$library" "app/src/main/jniLibs/$abi/libnode.so"
          done
          header="$(find /tmp/node-mobile -type f -path "*/include/node/node.h" -print -quit)"
          test -n "$header"
          mkdir -p app/src/main/cpp/node-include
          cp -R "$(dirname "$header")/." app/src/main/cpp/node-include/
          test -f app/src/main/cpp/node-include/node.h

      - name: Verify Gradle
        run: gradle --version

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaRun-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
